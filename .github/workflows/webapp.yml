# Webapp CI and GitHub Pages publish.
# GitHub Pages serves only the repo root or docs/ without a workflow, so this workflow
# uploads webapp/site/ and deploys it. The repo setting "Pages > Source" must be
# "GitHub Actions".
name: Webapp CI and Pages

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'webapp/**'
      - 'contract/**'
      - '.github/workflows/webapp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'webapp/**'
      - 'contract/**'
      - '.github/workflows/webapp.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run tests
      run: node --test webapp/tests/*.test.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configure Pages
      uses: actions/configure-pages@v5

    # index.html keeps the local Host URL and the Turnstile test key. This step puts the
    # production values from the repository variables (Settings > Secrets and variables >
    # Actions > Variables) into the published copy. With neither variable set, it publishes the
    # homepage without the analysis form. With only one set, it fails.
    - name: Configure the Host URL and the Turnstile site key
      env:
        DM_HOST_URL: ${{ vars.DM_HOST_URL }}
        DM_TURNSTILE_SITE_KEY: ${{ vars.DM_TURNSTILE_SITE_KEY }}
      run: |
        cp -R webapp/site "$RUNNER_TEMP/site"
        node webapp/configure.mjs "$RUNNER_TEMP/site/index.html"

    - name: Upload the Webapp
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # A failed or empty deploy can leave the site at 404 with a green run, so this step loads
    # the published homepage. With a Host URL set, it also checks that the Host answers.
    - name: Check the published site
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        DM_HOST_URL: ${{ vars.DM_HOST_URL }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if curl -fsS -m 20 "$PAGE_URL" -o "$RUNNER_TEMP/index.html"; then break; fi
          [ "$attempt" -lt 6 ] || { echo "$PAGE_URL does not answer" >&2; exit 1; }
          sleep 10
        done
        grep -q 'id="try-it"' "$RUNNER_TEMP/index.html" \
          || { echo "$PAGE_URL has no try-it section" >&2; exit 1; }
        if [ -n "$DM_HOST_URL" ]; then
          curl -fsS -m 20 "$DM_HOST_URL/api/health" | grep -q '"status":"ok"' \
            || { echo "$DM_HOST_URL/api/health is not ok" >&2; exit 1; }
        fi
