# Tool CI/CD: lint, test, build, and publish the dependency-metrics package.
# Keep this file name: the PyPI trusted publisher names ci.yml.
name: Tool CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dependency_metrics/**'
      - 'tests/**'
      - 'vendor/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'MANIFEST.in'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dependency_metrics/**'
      - 'tests/**'
      - 'vendor/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'MANIFEST.in'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js (for npm CLI)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest tests/ -v --cov=dependency_metrics --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy
        pip install -r requirements.txt

    - name: Run black
      run: black --check dependency_metrics/

    - name: Run flake8
      run: flake8 dependency_metrics/ --max-line-length=100

    - name: Run mypy
      run: mypy dependency_metrics/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build distribution
      run: python -m build

    - name: Check distribution
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    # A release of an extension-v* tag belongs to the Extension (extension.yml), not to the Tool.
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'extension-v')
    # PyPI trusted publishing: no API token is stored. The PyPI project must list this
    # repository, this workflow file (ci.yml), and the "pypi" environment as a trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/dependency-update-metrics/
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
