# Tool CI/CD: lint, test, build, and publish the dependency-metrics package and its
# container image (ghcr.io/imranur-rahman/mttx, see image/README.md).
# Keep this file name: the PyPI trusted publisher names ci.yml.
name: Tool CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dependency_metrics/**'
      - 'tests/**'
      - 'vendor/**'
      - 'image/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'MANIFEST.in'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'dependency_metrics/**'
      - 'tests/**'
      - 'vendor/**'
      - 'image/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'MANIFEST.in'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
  release:
    types: [ published ]
  # Run the tests and the image build on any branch by hand (no publish, no push).
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js (for npm CLI)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest tests/ -v --cov=dependency_metrics --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy
        pip install -r requirements.txt

    - name: Run black
      run: black --check dependency_metrics/

    - name: Run flake8
      run: flake8 dependency_metrics/ --max-line-length=100

    - name: Run mypy
      run: mypy dependency_metrics/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Before the PyPI publish: a release tag of the Tool must name the version in
    # pyproject.toml, so that a wrong tag publishes nothing.
    - name: Check the release tag
      if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'extension-v') && !startsWith(github.event.release.tag_name, 'action-v')
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        if [ "${TAG#v}" != "$version" ]; then
          echo "::error::The release tag $TAG does not name the version $version in pyproject.toml"
          exit 1
        fi

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build distribution
      run: python -m build

    - name: Check distribution
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    # A release of an extension-v* or action-v* tag belongs to the Extension (extension.yml) or the Action (github-action.yml), not to the Tool.
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'extension-v') && !startsWith(github.event.release.tag_name, 'action-v')
    # PyPI trusted publishing: no API token is stored. The PyPI project must list this
    # repository, this workflow file (ci.yml), and the "pypi" environment as a trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/dependency-update-metrics/
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-packages
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  # Build both images on each push and PR (no push to GHCR), so that a broken image
  # fails before a release. The OSV index comes from the cache of the ISO week, so the job
  # downloads the OSV data about once a week; the release job always builds a new index.
  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'release'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        # The full history, to find whether image/ changed.
        fetch-depth: 0

    - name: Find the week and whether image/ changed
      id: meta
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
        # A manual run, a new branch, or an unknown base builds arm64 too.
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] \
          || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
          || ! git diff --quiet "$BASE" HEAD -- image/; then
          echo "image_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "image_changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the OSV index of the week
      uses: actions/cache@v4
      with:
        path: osv-index/osv_database.parquet
        key: mttx-image-osv-${{ steps.meta.outputs.week }}

    - uses: docker/setup-buildx-action@v3

    - name: Build the image without the OSV index
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: tool
        load: true
        tags: mttx:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build the OSV index with the image
      id: osv
      run: bash image/build-osv-index.sh mttx:ci osv-index >> "$GITHUB_OUTPUT"

    - name: Build the image with the OSV index
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: osv
        build-contexts: osvindex=osv-index
        build-args: OSV_INDEX_DATE=${{ steps.osv.outputs.date }}
        load: true
        tags: mttx:ci-osv
        cache-from: type=gha

    - name: Check the images
      run: bash image/check-image.sh mttx:ci mttx:ci-osv "${{ steps.osv.outputs.date }}"

    # A change in image/ also builds the arm64 image (no load, no run), so that an arm64
    # break shows before a release.
    - uses: docker/setup-qemu-action@v3
      if: steps.meta.outputs.image_changed == 'true'

    - name: Build the image without the OSV index for arm64
      if: steps.meta.outputs.image_changed == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: tool
        platforms: linux/arm64
        cache-from: type=gha,scope=arm64
        cache-to: type=gha,mode=max,scope=arm64

  # After the PyPI publish of a release, push two tags for amd64 and arm64:
  # <version> and latest (no OSV index), and <version>-osv-<YYYY-MM-DD> (index inside).
  # It runs only when publish runs, and the build job already checked the tag.
  image-release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/imranur-rahman/mttx

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Read the version and the commits
      id: meta
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "pip_commit=$(git -C vendor/pip rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the image for amd64, to build the OSV index
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: tool
        load: true
        tags: mttx:release

    - name: Build the OSV index with the image
      id: osv
      run: bash image/build-osv-index.sh mttx:release osv-index >> "$GITHUB_OUTPUT"

    - name: Push the image without the OSV index
      id: push-tool
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: tool
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          ${{ env.IMAGE }}:latest
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          REVISION=${{ github.sha }}
          PIP_COMMIT=${{ steps.meta.outputs.pip_commit }}

    - name: Push the image with the OSV index
      id: push-osv
      uses: docker/build-push-action@v6
      with:
        context: .
        file: image/Dockerfile
        target: osv
        platforms: linux/amd64,linux/arm64
        push: true
        build-contexts: osvindex=osv-index
        tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-osv-${{ steps.osv.outputs.date }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          REVISION=${{ github.sha }}
          PIP_COMMIT=${{ steps.meta.outputs.pip_commit }}
          OSV_INDEX_DATE=${{ steps.osv.outputs.date }}

    - name: Check the pushed images
      run: |
        bash image/check-image.sh \
          "$IMAGE@${{ steps.push-tool.outputs.digest }}" \
          "$IMAGE@${{ steps.push-osv.outputs.digest }}" \
          "${{ steps.osv.outputs.date }}"

    - name: Write the tags and the digests to the job summary
      env:
        VERSION: ${{ steps.meta.outputs.version }}
        OSV_DATE: ${{ steps.osv.outputs.date }}
        TOOL_DIGEST: ${{ steps.push-tool.outputs.digest }}
        OSV_DIGEST: ${{ steps.push-osv.outputs.digest }}
      run: |
        {
          echo "### $IMAGE"
          echo "| Tags | Digest |"
          echo "|---|---|"
          echo "| \`$VERSION\`, \`latest\` | \`$TOOL_DIGEST\` |"
          echo "| \`$VERSION-osv-$OSV_DATE\` | \`$OSV_DIGEST\` |"
        } >> "$GITHUB_STEP_SUMMARY"
