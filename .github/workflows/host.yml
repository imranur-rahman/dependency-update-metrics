# Host CI: lint and test the Host (host/).
# The Host runs the Tool, so a change in dependency_metrics/ also runs these checks.
name: Host CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'host/**'
      - 'contract/**'
      - 'dependency_metrics/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/host.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'host/**'
      - 'contract/**'
      - 'dependency_metrics/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/host.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pytest
        pip install -e .
        pip install -r host/requirements.txt

    - name: Run black
      run: black --check host/

    - name: Run flake8
      run: flake8 host/ --max-line-length=100

    - name: Run tests
      run: pytest host/tests -v
