# Extension CI. It also runs on a change in contract/ and in the Webapp comparison.js,
# because the Extension unit tests read the contract examples and check that the
# no-dependencies rule matches the rule of comparison.js.
name: Extension CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extension/**'
      - 'contract/**'
      - 'webapp/site/static/js/comparison.js'
      - '.github/workflows/extension.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'extension/**'
      - 'contract/**'
      - 'webapp/site/static/js/comparison.js'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension

    steps:
    - uses: actions/checkout@v4

    # Node 24 runs the TypeScript unit tests without a build step (type stripping).
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: extension/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check types
      run: npm run check-types

    - name: Run unit tests
      run: npm run test:unit

    # The integration test downloads VS Code and opens it, so Linux needs a virtual display.
    - name: Run the integration test (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:integration

    - name: Run the integration test
      if: runner.os != 'Linux'
      run: npm run test:integration
