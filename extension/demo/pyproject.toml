# A demo project for the MTTX extension. Open this folder in VS Code to see
# the MTTU and MTTR of each dependency.
[project]
name = "mttx-demo"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "flask>=3.0",
  "pydantic>=2; python_version >= '3.10'",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.6"]

[dependency-groups]
dev = ["pytest>=8", "black>=24"]
