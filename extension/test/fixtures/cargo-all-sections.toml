[package]
name = "demo"
version = "0.1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
json = { package = "serde_json", version = "1" }
local = { path = "../local" }
from-git = { git = "https://example.com/repo.git" }
published-path = { path = "../pp", version = "0.2" }

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.renamed]
package = "log"
version = "0.4"

[dev-dependencies]
proptest = "1"

[build-dependencies]
cc = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dev-dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.x86_64-pc-windows-msvc.build-dependencies.embed-resource]
version = "2"

[[bin]]
name = "demo"
